<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DoggyStyle Workspace – Login</title>

  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <main style="max-width:520px;margin:40px auto;padding:0 16px;">
    <h1 style="margin:0 0 14px 0;">Login</h1>

    <div id="authMsg" style="margin:0 0 12px 0;color:#b00020;"></div>

    <form>
      <label style="display:block;margin:10px 0 6px;">E-Mail</label>
      <input id="loginEmail" type="email" autocomplete="email" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;" />

      <label style="display:block;margin:12px 0 6px;">Passwort</label>
      <input id="loginPass" type="password" autocomplete="current-password" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;" />

      <!-- optional: Name bei Registrierung -->
      <div id="regNameField" style="display:none;">
        <label style="display:block;margin:12px 0 6px;">Name (optional)</label>
        <input id="regName" type="text" autocomplete="name" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;" />
      </div>

      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;">
        <button id="btnLogin" style="padding:10px 14px;border-radius:10px;border:1px solid #333;">Anmelden</button>
        <button id="btnRegister" style="padding:10px 14px;border-radius:10px;border:1px solid #333;">Registrieren</button>
        <button id="btnForgot" type="button" style="padding:10px 14px;border-radius:10px;border:1px solid #333;">Passwort vergessen</button>
      </div>
    </form>

    <div style="margin-top:18px;font-size:12px;opacity:.65;">
      ANA036.2 – AUTH_READY_GUARD_FIX
    </div>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
