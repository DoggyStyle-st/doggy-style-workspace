<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
  <title>Doggy Style Workspace – Passwort zurücksetzen</title>
  <link rel="stylesheet" href="login_override.css"/>
  <style>
    body{background:#0f0f12;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
    .card{max-width:520px;margin:40px auto;padding:18px 18px 14px;border-radius:14px;background:rgba(30,30,36,.75);box-shadow:0 10px 30px rgba(0,0,0,.45);}
    .field{display:block;margin:12px 0;}
    .field span{display:block;font-size:12px;opacity:.8;margin-bottom:6px;}
    input{width:100%;padding:12px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.16);background:rgba(0,0,0,.25);color:#fff;}
    .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;}
    .btn{padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;cursor:pointer;}
    .btn.primary{background:rgba(90,180,90,.25);border-color:rgba(90,180,90,.45);}
    .msg{margin-top:10px;font-size:13px;opacity:.9;white-space:pre-wrap;}
    a{color:#9ad;}
  </style>
</head>
<body>
  <div class="card">
    <h2 style="margin:0 0 6px 0;">🔐 Passwort zurücksetzen</h2>
    <div style="opacity:.8;font-size:13px;">Bitte neues Passwort setzen. Danach zurück zum Login.</div>

    <label class="field">
      <span>Neues Passwort</span>
      <input id="pw1" type="password" autocomplete="new-password" placeholder="mind. 6 Zeichen"/>
    </label>
    <label class="field">
      <span>Neues Passwort (wiederholen)</span>
      <input id="pw2" type="password" autocomplete="new-password" placeholder="mind. 6 Zeichen"/>
    </label>

    <div class="row">
      <button class="btn primary" id="btnSet">Passwort setzen</button>
      <a class="btn" href="login.html" style="text-decoration:none;display:inline-flex;align-items:center;">Zum Login</a>
    </div>

    <div class="msg" id="msg">Lade…</div>
  </div>

  <script defer src="firebase-config.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script>
  (function(){
    const qs = new URLSearchParams(location.search);
    const oobCode = qs.get('oobCode');
    const mode = qs.get('mode');
    const msg = (t)=>{ const el=document.getElementById('msg'); if(el) el.textContent=t||''; };
    const btn = ()=>document.getElementById('btnSet');
    function readyFirebase(){
      return window.firebaseConfig && window.firebase && window.firebase.initializeApp && window.firebase.auth;
    }
    async function init(){
      msg('Initialisiere…');
      // wait scripts
      const t0=Date.now();
      while(!readyFirebase() && Date.now()-t0<8000) await new Promise(r=>setTimeout(r,100));
      if(!readyFirebase()){ msg('Firebase konnte nicht geladen werden. Bitte Internet prüfen und Seite neu laden.'); return; }
      try{ try{ firebase.app(); }catch(_){ firebase.initializeApp(window.firebaseConfig); } }catch(e){}
      const auth = firebase.auth();
      if(mode!=='resetPassword' || !oobCode){ msg('Ungültiger oder abgelaufener Link. Bitte erneut „Passwort vergessen“ ausführen.'); return; }
      try{
        const email = await auth.verifyPasswordResetCode(oobCode);
        msg('Konto: '+email+'\nBitte neues Passwort setzen.');
      }catch(e){
        msg('Link ungültig/abgelaufen. Bitte erneut „Passwort vergessen“ ausführen.');
      }
      btn().onclick = async ()=>{
        try{
          const p1=(document.getElementById('pw1').value||'').trim();
          const p2=(document.getElementById('pw2').value||'').trim();
          if(p1.length<6){ msg('Passwort muss mindestens 6 Zeichen haben.'); return; }
          if(p1!==p2){ msg('Passwörter stimmen nicht überein.'); return; }
          await auth.confirmPasswordReset(oobCode, p1);
          msg('✅ Passwort geändert. Du kannst dich jetzt anmelden.');
        }catch(e){
          msg('Fehler: '+(e?.code||e?.message||e));
        }
      };
    }
    document.addEventListener('DOMContentLoaded', init);
  })();
  </script>
</body>
</html>
