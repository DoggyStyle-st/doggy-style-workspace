<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Passwort zurücksetzen</title>
  <link rel="stylesheet" href="login_override.css" />
  <style>
    body{background:#0b0b0c;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;}
    .wrap{max-width:520px;margin:40px auto;padding:18px;}
    .card{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.10);border-radius:14px;padding:18px;backdrop-filter:blur(8px);} 
    .row{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap;}
    label{display:block;font-size:13px;opacity:.85;margin:10px 0 6px;}
    input{width:100%;padding:12px 12px;border-radius:12px;border:1px solid rgba(255,255,255,0.18);background:rgba(0,0,0,0.35);color:#fff;}
    button{padding:10px 14px;border-radius:12px;border:1px solid rgba(255,255,255,0.18);background:rgba(255,255,255,0.10);color:#fff;cursor:pointer;}
    button.primary{background:rgba(90,180,120,0.35);}
    .msg{margin-top:12px;font-size:14px;opacity:.9;white-space:pre-wrap;}
    .muted{opacity:.7;font-size:12px;}
  </style>
  <script defer src="firebase-config.js?v=M50.9.9GB355_RELIABLE_CUSTOMER_PROPOSAL_QUEUE_20260613_ROOTONLY"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h2 style="margin:0 0 6px 0">🔐 Passwort zurücksetzen</h2>
      <div class="muted">Bitte ein neues Passwort vergeben. (Mind. 6 Zeichen)</div>

      <label for="pw1">Neues Passwort</label>
      <input id="pw1" type="password" autocomplete="new-password" />

      <label for="pw2">Neues Passwort wiederholen</label>
      <input id="pw2" type="password" autocomplete="new-password" />

      <div class="row">
        <button id="btnSave" class="primary">Passwort setzen</button>
        <button id="btnBack">Zurück zum Login</button>
      </div>

      <div id="msg" class="msg"></div>
    </div>
  </div>

<script>
(function(){
  const $ = (id)=>document.getElementById(id);
  const msg = (t)=>{ const el=$('msg'); if(el) el.textContent=t||''; };
  const basePath = (()=>{ try{ return location.pathname.replace(/[^/]*$/, '/'); }catch(e){ return '/'; } })();
  const toLogin = ()=>{ try{ location.href = basePath + 'login.html'; }catch(e){ location.href='login.html'; } };
  function q(name){ try{ return new URL(location.href).searchParams.get(name)||''; }catch(e){ return ''; } }

  async function init(){
    if(!(window.firebaseConfig && window.firebase && window.firebase.initializeApp)){
      msg('Firebase nicht verfügbar.');
      return;
    }
    try{ firebase.app(); }catch(_){ firebase.initializeApp(window.firebaseConfig); }

    const mode = q('mode');
    const oobCode = q('oobCode');
    if(mode !== 'resetPassword' || !oobCode){
      msg('Ungültiger oder abgelaufener Link.\nBitte erneut „Passwort vergessen“ ausführen.');
      return;
    }

    $('btnSave').onclick = async ()=>{
      const p1 = ($('pw1').value||'');
      const p2 = ($('pw2').value||'');
      if(p1.length < 6){ msg('Passwort zu kurz (mind. 6 Zeichen).'); return; }
      if(p1 !== p2){ msg('Passwörter stimmen nicht überein.'); return; }
      try{
        msg('Prüfe Link…');
        await firebase.auth().verifyPasswordResetCode(oobCode);
        msg('Setze neues Passwort…');
        await firebase.auth().confirmPasswordReset(oobCode, p1);
        msg('✅ Passwort gesetzt. Du kannst dich jetzt anmelden.');
        setTimeout(toLogin, 900);
      }catch(e){
        const code = e && e.code ? String(e.code) : '';
        msg('Reset fehlgeschlagen: ' + (code || e.message || e));
      }
    };

    $('btnBack').onclick = ()=>toLogin();
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
