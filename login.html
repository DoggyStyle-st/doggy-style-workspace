<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>DoggyStyle – Login</title>
  <link rel="stylesheet" href="./css/dashboard_master.css">
  <style>
    /* Minimal fallback, falls CSS nicht greift */
    body{margin:0;min-height:100vh;display:flex;align-items:flex-start;justify-content:flex-start;background:#fff;}
  </style>
</head>
<body>
  <main style="padding:10px; width:100%;">
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <label>E-Mail <input id="loginEmail" type="email" autocomplete="email" style="background:#ffffb5;"/></label>
      <label>Passwort <input id="loginPass" type="password" autocomplete="current-password" style="background:#ffffb5;"/></label>
      <button id="btnLogin" type="button">Anmelden</button>
      <span id="authMsg" style="margin-left:8px;"></span>
    </div>
  </main>

  <!-- Firebase config (ROOT) -->
  <script defer src="./firebase-config.js?v=ANA037_LOGIN_BTN1"></script>

  <!-- Firebase compat libs -->
  <script defer src="https://www.gstatic.com/firebasejs/9.6.11/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.6.11/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.6.11/firebase-firestore-compat.js"></script>

  <!-- Auth handler -->
  <script defer src="./auth.js?v=ANA037_LOGIN_BTN1"></script>
</body>
</html>
