<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
  <title>Doggy Style · Login</title>

  <link rel="manifest" href="./manifest.json"/>
  <meta name="theme-color" content="#101014"/>
  <link rel="apple-touch-icon" href="./assets/logo.png"/>

  <link rel="stylesheet" href="./styles.css?v=ANA037P2"/>
  <link rel="stylesheet" href="./login_override.css?v=ANA037P2"/>
</head>

<body class="bg">
  <main class="wrap" style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;">
    <section class="card" style="width:min(520px, 100%); padding:22px;">
      <div style="display:flex; gap:14px; align-items:center; margin-bottom:14px;">
        <img src="./assets/logo.png" alt="Doggy Style" style="width:54px; height:54px; border-radius:14px; object-fit:cover;"/>
        <div>
          <div style="font-weight:900; font-size:20px; line-height:1.1;">Doggy Style Workspace</div>
          <div class="muted" style="margin-top:4px;">Anmelden</div>
        </div>
      </div>

      <form id="loginForm" autocomplete="on">
        <label class="muted" for="loginEmail">E‑Mail</label>
        <input id="loginEmail" type="email" inputmode="email" autocomplete="email" required
               style="width:100%; margin:6px 0 12px 0;"/>

        <label class="muted" for="loginPass">Passwort</label>
        <input id="loginPass" type="password" autocomplete="current-password" required
               style="width:100%; margin:6px 0 14px 0;"/>

        <button id="btnLogin" class="primary" type="submit" style="width:100%;">Anmelden</button>

        <div style="display:flex; gap:10px; justify-content:space-between; margin-top:12px; flex-wrap:wrap;">
          <button id="btnForgot" class="pill" type="button">Passwort vergessen</button>
          <button id="btnRegister" class="pill" type="button">Registrieren</button>
        </div>

        <p id="authMsg" class="muted" style="margin-top:12px; min-height:1.2em;"></p>
      </form>
    </section>
  </main>

  <!-- Firebase (compat) -->
  <script defer src="./firebase-config.js?v=ANA037P2"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

  <!-- Login handler -->
  <script defer src="./auth.js?v=ANA037P2"></script>

  <div class="build-badge" id="buildBadge">ANA037P2</div>
</body>
</html>
