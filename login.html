<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Doggy Style Workspace · Login</title>
  <link href="manifest.json" rel="manifest"/>
  <meta name="theme-color" content="#101014"/>
  <link href="assets/logo.png" rel="apple-touch-icon"/>
  <link href="styles.css?v=20260101a" rel="stylesheet"/>
</head>
<body class="bg-watermark page-login">
  <header class="topbar">
    <div class="brand brand--login">
      <img alt="Doggy Style" class="brand__logo brand__logo--big brand__logo--animated" src="assets/logo.png"/>
    </div>
  </header>

  <main class="shell">
    <section class="panel is-active">
      <div class="card loginCard">
        <h1 style="margin:0 0 10px 0;">Anmelden</h1>

        <div class="row" style="flex-wrap:wrap; gap:12px; margin-top:10px">
          <label class="field" style="min-width:260px; flex:1;">
            <span>Name (optional)</span>
            <input id="regName" type="text" autocomplete="off" autocapitalize="words" placeholder="z. B. Rex Mustermann"/>
          </label>

          <label class="field" style="min-width:260px; flex:1;">
            <span>E‑Mail</span>
            <input id="loginEmail" type="email" inputmode="email" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="name@domain.de"/>
          </label>

          <label class="field" style="min-width:260px; flex:1;">
            <span>Passwort</span>
            <input id="loginPass" type="password" autocomplete="new-password" autocapitalize="none" spellcheck="false" placeholder="••••••••"/>
          </label>
        </div>

        <div class="authActions" style="margin-top:14px">
          <div class="authActions__left">
            <button id="btnLogin" class="primary">Anmelden</button>
            <button id="btnRegister" class="btnSecondary">Registrieren</button>
          </div>
          <button id="btnForgot" class="btnLink" type="button">Passwort vergessen?</button>
        </div>

        <p id="authMsg" class="muted" style="margin-top:10px"></p>
      </div>
    </section>
  </main>

  <script defer src="firebase-config.js?v=20251227k"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script defer src="auth.js?v=20251228e"></script>
</body>
</html>
