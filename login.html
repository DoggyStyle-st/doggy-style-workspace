<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>DoggyStyle – Login</title>

  <!-- Styles: keep your existing css links if you want; this is a minimal safe base -->
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="stylesheet" href="./css/dashboard_master.css">
</head>
<body>

<main class="authWrap">
  <section class="panel is-active">
    <div class="card loginCard" aria-label="Anmeldung">
      <div class="row loginFields">
        <label class="field" id="emailField">
          <span>E‑Mail</span>
          <input id="loginEmail" type="email" inputmode="email" autocomplete="email"
                 autocapitalize="none" spellcheck="false" placeholder="dein.name@email.de"/>
        </label>

        <label class="field" id="pwField">
          <span>Passwort</span>
          <input id="loginPass" type="password" autocomplete="current-password"
                 autocapitalize="none" spellcheck="false" placeholder="••••••••"/>
        </label>
      </div>

      <div class="authActions">
        <div class="authActions__left">
          <button id="btnLogin" class="primary" type="button">Anmelden</button>
          <button id="btnRegister" class="btnSecondary" type="button">Registrieren</button>
        </div>
        <button id="btnForgot" class="btnLink btnLink--text" type="button">Passwort vergessen?</button>
      </div>

      <p id="authMsg" class="muted" style="margin-top:10px"></p>
    </div>
  </section>
</main>

<!-- 1) Your config MUST be from ROOT -->
<script defer src="./firebase-config.js?v=ANA037_LOGIN_CFG1"></script>

<!-- 2) Firebase compat SDKs -->
<script defer src="https://www.gstatic.com/firebasejs/9.6.11/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/9.6.11/firebase-auth-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/9.6.11/firebase-firestore-compat.js"></script>

<!-- 3) Auth logic (ROOT) -->
<script defer src="./auth.js?v=ANA037_LOGIN_AUTH1"></script>

<div class="build-badge" id="buildBadge">Build v11-LOGIN-MINFIX-A</div>
</body>
</html>
