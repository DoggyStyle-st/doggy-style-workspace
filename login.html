<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <title>DoggyStyle – Login</title>

  <!-- Styles: keep original paths, but provide safe fallbacks -->
  <link rel="stylesheet" href="css/dashboard_master.css" onerror="this.removeAttribute('onerror');this.href='dashboard_master.css'" />
  <link rel="stylesheet" href="css/styles.css" onerror="this.removeAttribute('onerror');this.href='styles.css'" />
  <link rel="stylesheet" href="css/login_override.css" onerror="this.removeAttribute('onerror');this.href='login_override.css'" />
</head>
<body>
  <main>
    <section class="panel is-active">
      <div class="card loginCard" aria-label="Anmeldung">
        <div class="row loginFields">
          <label class="field" id="emailField">
            <span>E-Mail</span>
            <input id="loginEmail" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" />
          </label>

          <label class="field" id="pwField">
            <span>Passwort</span>
            <input id="loginPass" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" />
          </label>
        </div>

        <div class="authActions">
          <div class="authActions__left">
            <button id="btnLogin" class="primary" type="button">Anmelden</button>
            <button id="btnRegister" class="btnSecondary" type="button">Registrieren</button>
          </div>
          <button id="btnForgot" class="btnLink btnLink--text" type="button">Passwort vergessen?</button>
        </div>

        <p id="authMsg" class="muted" style="margin-top:10px"></p>
      </div>
    </section>
  </main>

  <!-- Firebase config must be ROOT -->
  <script defer src="firebase-config.js?v=ANA037_AUTH_ES5_FIX"></script>

  <!-- Firebase (compat) libs – single version only -->
  <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

  <!-- Auth handler (ES5) -->
  <script defer src="auth.js?v=ANA037_AUTH_ES5_FIX"></script>

  <div class="build-badge" id="buildBadge">Build v11-LOGIN-ES5</div>
</body>
</html>
