<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DoggyStyle – Login</title>
  <link rel="stylesheet" href="styles.css?v=ANA037_LOGIN_ES5" />
  <style>
    /* Fallback, falls styles.css nicht lädt */
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0d12;color:#fff;font-family:-apple-system,BlinkMacSystemFont,system-ui,Segoe UI,Roboto,Arial;}
    .card{width:min(980px,92vw);padding:22px 20px;border-radius:18px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);backdrop-filter:blur(14px);}
    .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
    label{flex:1;min-width:240px;display:flex;flex-direction:column;gap:6px;}
    input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,0.22);background:rgba(0,0,0,0.25);color:#fff;}
    .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px;}
    button{padding:10px 14px;border-radius:12px;border:1px solid rgba(255,255,255,0.18);background:rgba(255,255,255,0.12);color:#fff;}
    button.primary{background:rgba(255,255,255,0.18);}
    button.link{border:none;background:transparent;text-decoration:underline;opacity:0.9;}
    #authMsg{margin-top:10px;opacity:0.9;}
    .build{position:fixed;left:12px;top:10px;font-size:12px;opacity:0.7;}
  </style>
</head>
<body>
  <div class="build">Build v11-LOGIN-ES5</div>
  <div class="card" role="region" aria-label="Anmeldung">
    <div class="row">
      <label>
        <span>E-Mail</span>
        <input id="loginEmail" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" />
      </label>
      <label>
        <span>Passwort</span>
        <input id="loginPass" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" />
      </label>
    </div>

    <div class="actions">
      <button id="btnLogin" class="primary" type="button">Anmelden</button>
      <button id="btnRegister" type="button">Registrieren</button>
      <button id="btnForgot" class="link" type="button">Passwort vergessen?</button>
    </div>

    <div id="authMsg"></div>
  </div>

  <!-- Firebase config (ROOT) -->
  <script defer src="firebase-config.js?v=ANA037_LOGIN_ES5"></script>

  <!-- Firebase compat libs -->
  <script defer src="https://www.gstatic.com/firebasejs/9.6.11/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.6.11/firebase-auth-compat.js"></script>

  <!-- Auth handler -->
  <script defer src="auth.js?v=ANA037_LOGIN_ES5"></script>
</body>
</html>
