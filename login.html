<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Doggy Style Workspace · Login</title>
  <link href="manifest.json" rel="manifest"/>
  <meta name="theme-color" content="#101014"/>
  <link href="assets/logo.png" rel="apple-touch-icon"/>
  <link href="styles.css?v=20251227h" rel="stylesheet"/>
</head>
<body class="bg-watermark page-login">
  <header class="topbar">
    <div class="brand">
      <img alt="Doggy Style" class="brand__logo brand__logo--big brand__logo--animated" src="assets/logo.png"/>
      <div class="brand__text">
        <div class="brand__title">Doggy Style Workspace</div>
        <div class="brand__sub">Bitte anmelden</div>
      </div>
    </div>
  </header>

  <main class="shell shell--auth">
    <section class="panel is-active">
      <div class="card auth-card">
        <h1 class="auth-title">Anmelden</h1>
        <p class="muted auth-sub">Für geräteübergreifende Daten bitte anmelden.</p>

        <form id="authForm" class="auth-grid" autocomplete="on">
          <label class="field">
            <span>Name (optional)</span>
            <input id="regName" name="displayName" type="text" autocomplete="name" placeholder="z. B. Rex Mustermann"/>
          </label>

          <label class="field">
            <span>E‑Mail</span>
            <input id="loginEmail" name="email" type="email" autocomplete="username" inputmode="email" placeholder="name@domain.de"/>
          </label>

          <label class="field">
            <span>Passwort</span>
            <input id="loginPass" name="password" type="password" autocomplete="current-password" placeholder="••••••••"/>
          </label>
        </form>

        <div class="auth-actions">
          <button id="btnLogin" class="primary">Anmelden</button>
          <button id="btnRegister" type="button">Registrieren</button>
          <button id="btnReset" type="button" class="link" title="Passwort per E-Mail zurücksetzen">Passwort vergessen?</button>
        </div>

        <p id="authMsg" class="muted auth-msg"></p>
      </div>
    </section>
  </main>

  <script defer src="firebase-config.js?v=20251227k"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script defer src="auth.js?v=20251231a"></script>
</body>
</html>
