<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>DoggyStyle – DIAG</title>

  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <link rel="stylesheet" href="./styles.css?v=ANA037P2" />
  <style>
    body{background:#0b0c0f}
    .wrap{max-width:980px;margin:0 auto;padding:16px}
    .card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);border-radius:14px;padding:14px;margin:12px 0}
    .k{opacity:.75;font-size:12px}
    .v{font-size:18px;font-weight:800;margin-top:4px;word-break:break-word}
    .row{display:grid;grid-template-columns:1fr;gap:12px}
    @media(min-width:860px){.row{grid-template-columns:1fr 1fr}}
    button{padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#e9eef6;font-weight:800}
    button:active{transform:scale(.98)}
    pre{white-space:pre-wrap;background:rgba(0,0,0,.35);padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.10)}
  </style>
</head>
<body>
  <div class="wrap">
    <h1 style="margin:8px 0 0 0;">DIAG</h1>
    <div class="muted" style="margin-top:6px;">Build: <span id="build">…</span></div>

    <div class="row">
      <div class="card">
        <div class="k">URL</div><div class="v" id="url">…</div>
        <div class="k" style="margin-top:10px;">User-Agent</div><div class="v" id="uaShort">…</div>
        <div class="k" style="margin-top:10px;">Service Worker</div><div class="v" id="sw">…</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;">
          <button id="btnUnreg">Service Worker abmelden</button>
          <button id="btnHard">Hart neu laden (?v=neu)</button>
        </div>
      </div>

      <div class="card">
        <div class="k">Fetch-Tests</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;">
          <button id="btnFetchApp">app.js fetch</button>
          <button id="btnFetchCss">styles.css fetch</button>
        </div>
        <div class="k" style="margin-top:10px;">Ergebnis</div>
        <pre id="out">—</pre>
      </div>
    </div>
  </div>

  <script src="./diag.js?v=ANA037P2"></script>
</body>
</html>
