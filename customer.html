<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Doggy Style · Kundenportal</title>
  <link href="manifest.json" rel="manifest"/>
  <meta name="theme-color" content="#101014"/>
  <link href="assets/logo.png" rel="apple-touch-icon"/>
  <link href="styles.css?v=20260303_customer1" rel="stylesheet"/>
</head>
<body class="bg-watermark">
  <main class="shell" style="padding-top:20px">
<!-- CUSTOMER PORTAL (nur für Rolle customer sichtbar) -->
<section class="panel" id="customerPortal">
  <div class="card" style="max-width:900px;margin:0 auto;">
    <div class="row between" style="align-items:flex-start; gap:12px; flex-wrap:wrap;">
      <div>
        <h1 style="margin:0">Kundenportal</h1>
        <p class="muted" id="customerPortalSubtitle" style="margin:6px 0 0 0;">Aktuell liegen keine Aufgaben für dich vor.</p>
      </div>
      <button class="btn" id="btnCustomerLogout">Abmelden</button>
    </div>
    <div class="hint" style="margin-top:10px">
      <strong>Hinweis:</strong> Hier siehst du nur Aufgaben/Formulare, die Doggy Style Hundepension für dich freigegeben hat.
    </div>
  </div>

  <div class="card" style="max-width:900px;margin:12px auto 0 auto;">
    <h2>Deine Aufgaben</h2>
    <div class="list" id="customerTaskList"></div>
  </div>

  <div class="card" id="customerTaskEditor" style="max-width:900px;margin:12px auto 0 auto; display:none;">
    <div class="row between" style="gap:10px; flex-wrap:wrap;">
      <div>
        <h2 id="customerTaskTitle" style="margin:0">Aufgabe</h2>
        <div class="muted" id="customerTaskMeta" style="margin-top:6px"></div>
      </div>
      <div class="row" style="gap:10px; flex-wrap:wrap;">
        <button class="btn" id="btnCustomerTaskBack">Zurück</button>
        <button class="btn primary" id="btnCustomerTaskSubmit">Absenden</button>
      </div>
    </div>
    <div id="customerTaskFormRoot" style="margin-top:12px"></div>
    <div class="hint" id="customerTaskSaveHint" style="margin-top:10px"></div>
  </div>
</section>
  </main>

  <!-- Firebase zuerst -->
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

  <!-- Config dann App -->
  <script src="firebase-config.js?v=20260303_customer1"></script>
  <script src="app.js?v=M50.9.9S_QMERGE_STATSOK_INBOXFIX_MASTER_20260311"></script>

  <script>
    // Falls jemand ohne Login hier landet → zur Login-Seite
    (function(){
      function goLogin(){ location.href='login.html'; }
      var tries=0;
      var t=setInterval(function(){
        tries++;
        try{
          if(window.CLOUD && CLOUD.auth){
            clearInterval(t);
            CLOUD.auth.onAuthStateChanged(function(u){ if(!u) goLogin(); });
          }
        }catch(e){}
        if(tries>80){ clearInterval(t); }
      }, 100);
    })();
  </script>
</body>
</html>
