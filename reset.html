<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
  <title>Doggy Style Workspace – Reset</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;padding:24px;line-height:1.4}
    code{background:#f2f2f2;padding:2px 6px;border-radius:6px}
    .warn{color:#8a4b00;font-weight:600}
  </style>
</head>
<body>
  <h2>Workspace Reset</h2>
  <p>Diese Seite löscht <b>Service Worker</b> + <b>Caches</b> für diese Domain und lädt danach die App neu.</p>
  <p class="warn">Hinweis: Lokale Offline-Daten (localStorage/sessionStorage) werden ebenfalls gelöscht.</p>
  <p>Status: <span id="st">läuft…</span></p>
  <pre id="log"></pre>

<script>
(async () => {
  const log = (m) => { document.getElementById('log').textContent += m + "\n"; };
  const st = (m) => { document.getElementById('st').textContent = m; };

  try {
    st('Service Worker entfernen…');
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      log('Registrations: ' + regs.length);
      for (const r of regs) {
        try { await r.unregister(); log('unregister ok'); } catch(e){ log('unregister err: '+e); }
      }
    } else {
      log('serviceWorker nicht verfügbar');
    }

    st('Caches löschen…');
    if (window.caches && caches.keys) {
      const keys = await caches.keys();
      log('Cache keys: ' + keys.join(', '));
      for (const k of keys) {
        try { await caches.delete(k); log('cache delete ok: ' + k); } catch(e){ log('cache delete err: '+e); }
      }
    } else {
      log('caches API nicht verfügbar');
    }

    st('Storage löschen…');
    try { localStorage.clear(); log('localStorage cleared'); } catch(e){ log('localStorage err: '+e); }
    try { sessionStorage.clear(); log('sessionStorage cleared'); } catch(e){ log('sessionStorage err: '+e); }

    st('Neu laden…');
    setTimeout(() => {
      location.href = './?v=RESET_' + Date.now();
    }, 600);
  } catch (e) {
    st('Fehler');
    log(String(e));
  }
})();
</script>
</body>
</html>
