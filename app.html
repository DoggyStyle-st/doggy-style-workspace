<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Doggy Style Workspace - App</title>
  <style>
    #anaProbeOverlay{
      position:fixed; right:10px; bottom:10px;
      z-index:2147483647;
      background:rgba(0,0,0,0.72);
      border:1px solid rgba(255,255,255,0.18);
      color:#fff;
      padding:10px 12px;
      border-radius:12px;
      font: 12px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 48vw;
      box-shadow: 0 8px 30px rgba(0,0,0,0.35);
      pointer-events:none;
    }
    #anaProbeOverlay b{ font-weight:800; }
    #anaProbeOverlay code{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size:11px; }
  </style>
</head>
<body>
  <script>
    (function(){
      var o=document.createElement('div');
      o.id='anaProbeOverlay';
      o.innerHTML='<b>ANA028 Probe</b><br><span>HTML läuft</span><br><code>warte auf JS…</code>';
      document.documentElement.appendChild(o);

      function setLine(msg){
        try{
          o.innerHTML='<b>ANA028 Probe</b><br><span>'+msg+'</span><br><code>'+new Date().toLocaleTimeString()+'</code>';
        }catch(e){}
      }

      async function purgeSW(){
        try{
          if(!('serviceWorker' in navigator)) { setLine('Kein ServiceWorker'); return; }
          var regs = await navigator.serviceWorker.getRegistrations();
          for (var i=0;i<regs.length;i++){ try{ await regs[i].unregister(); }catch(e){} }
          if('caches' in window){
            var keys = await caches.keys();
            for (var j=0;j<keys.length;j++){ try{ await caches.delete(keys[j]); }catch(e){} }
          }
          setLine('SW & Cache gelöscht – lade Probe-JS');
        }catch(e){
          setLine('SW-Purge Fehler (trotzdem weiter): '+(e && e.message ? e.message : e));
        }
      }

      purgeSW().then(function(){
        var s=document.createElement('script');
        s.src='app_probe_ANA028.js?ts=' + Date.now();
        s.onload=function(){ setLine('Probe-JS geladen'); };
        s.onerror=function(){ setLine('Probe-JS NICHT geladen (404?)'); };
        document.head.appendChild(s);
      });
    })();
  </script>

  <!-- Original App script (kept) -->
  <script src="app.js?v=ANA028"></script>

  <div style="position:fixed;left:10px;bottom:10px;color:#cfcfcf;font:12px/1.2 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;opacity:.75;z-index:99999;">
    Build: V10FIX6-A-ANA028
  </div>
</body>
</html>
