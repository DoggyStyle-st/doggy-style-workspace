<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0c10" />
  <title>Doggy Style Workspace</title>

  <!-- Canonical paths -->
  <link rel="stylesheet" href="./css/styles.css?v=ANA037P10F" />
  <link rel="stylesheet" href="./css/dashboard_master.css?v=ANA037P10F" />
  <link rel="icon" href="./assets/logo.png" />
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <div class="app-logo"><img src="./assets/logo.png" alt="Doggy Style" /></div>
      <div class="app-title">Doggy Style Workspace</div>
    </div>

    <nav class="tabs" aria-label="Navigation">
      <button class="pill" data-tab="home">Start</button>
      <button class="pill" data-tab="kunden">Hunde/Kunden</button>
      <button class="pill" data-tab="vertrag">Betreuungsvertrag</button>
      <button class="pill" data-tab="arbeitsblaetter">Arbeitsblätter</button>
      <button class="pill" data-tab="hygiene">Hygiene</button>
      <button class="pill" data-tab="medikamente">Medikamente</button>
      <button class="pill" data-tab="analytics">Auswertungen</button>
      <button class="pill" data-tab="kalender">Kalender</button>
      <button class="pill" data-tab="eingang">Eingänge</button>
      <button class="pill" data-tab="aufenthalte">Aufenthalte</button>
      <button class="pill" data-tab="rechnungen">Rechnungen</button>
      <button class="pill" data-tab="einstellungen">Einstellungen</button>
    </nav>

    <div class="topbar__right">
      <span id="syncPill" class="sync-pill">Status: <span id="syncStateDot">●</span> <span id="syncStateText">Offline</span></span>
      <span id="syncUser" class="sync-user"></span>
      <button id="btnLogout" class="pill pill--danger" type="button">Abmelden</button>
    </div>
  </header>

  <main class="container">
    <!-- 14 Tage / Auslastung -->
    <section class="panel" id="panel-home">
      <div class="dash-grid">
        <div class="card kpi">
          <div class="kpi__title">Tagesbetreuung</div>
          <div class="kpi__value"><span id="kpiDayNow">0</span> / <span id="kpiDayMax">13</span></div>
          <div class="kpi__sub" id="kpiDayNote">Ruhiger Tag</div>
        </div>

        <div class="center-logo">
          <img src="./assets/logo.png" alt="Doggy Style" />
        </div>

        <div class="card kpi">
          <div class="kpi__title">Urlaubsbetreuung</div>
          <div class="kpi__value"><span id="kpiNightNow">0</span> / <span id="kpiNightMax">10</span></div>
          <div class="kpi__sub" id="kpiNightNote">Ruhiger Tag</div>
        </div>
      </div>

      <div class="card block">
        <h2>Auslastung - nächste 14 Tage</h2>
        <div id="home14days" class="home14days">
          <div class="muted">Lade Daten...</div>
        </div>
      </div>

      <div class="card block">
        <h2>Schnellaktionen</h2>
        <div class="quick-actions">
          <button id="btnNewAufenthalt" class="quick-btn" type="button">
            <img class="quick-icon" src="./assets/pfote.png" alt="" />
            Neuer Aufenthalt
          </button>
          <button id="btnGoKunden" class="quick-btn" type="button">Hunde/Kunden</button>
          <button id="btnGoRechnungen" class="quick-btn" type="button">Rechnungen</button>
          <button id="btnGoEinstellungen" class="quick-btn" type="button">Einstellungen</button>
        </div>
      </div>

      <div class="build-badge" id="buildBadge">Build: ANA037P10F</div>
      <div id="jsReadyBadge" class="js-ready-badge" style="display:none;">JS OK</div>
      <div id="jsNotReadyBadge" class="js-not-ready-badge" style="display:none;">JS nicht bereit (timeout)</div>
    </section>

    <!-- Placeholders for other tabs (app.js will fill / switch) -->
    <section class="panel" id="panel-kunden" hidden></section>
    <section class="panel" id="panel-vertrag" hidden></section>
    <section class="panel" id="panel-arbeitsblaetter" hidden></section>
    <section class="panel" id="panel-hygiene" hidden></section>
    <section class="panel" id="panel-medikamente" hidden></section>

    <section class="panel" id="panel-analytics" hidden>
      <h2>Auswertungen</h2>
      <div id="auswertungen_root">Lade...</div>
    </section>

    <section class="panel" id="panel-kalender" hidden></section>
    <section class="panel" id="panel-eingang" hidden></section>
    <section class="panel" id="panel-aufenthalte" hidden></section>
    <section class="panel" id="panel-rechnungen" hidden></section>
    <section class="panel" id="panel-einstellungen" hidden></section>
  </main>

  <!-- Single editor modal (avoid duplicates / broken DOM) -->
  <div id="editorModal" class="ds-hidden" aria-hidden="true">
    <div class="ds-backdrop" onclick="closeEditorModal()"></div>
    <div class="ds-panel" role="dialog" aria-modal="true" aria-labelledby="editorModalTitle">
      <div class="ds-header">
        <div id="editorModalTitle" class="ds-title">Editor</div>
        <button class="ds-close" type="button" onclick="closeEditorModal()">Schließen</button>
      </div>
      <div id="editorRoot" class="ds-body">
        <p>Editor wird geladen...</p>
      </div>
    </div>
  </div>

  <!-- Firebase config FIRST -->
  <script src="./firebase-config.js?v=ANA037P10F"></script>

  <!-- Boot / loader (must exist in repo root) -->
  <script defer src="./app_init.js?v=ANA037P10F"></script>
</body>
</html>
