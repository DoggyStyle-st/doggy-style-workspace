<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
  <title>Doggy Style Workspace · App</title>

  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#101014"/>
  <link rel="apple-touch-icon" href="assets/logo.png"/>

  <!-- CSS: bitte Pfade prüfen: styles.css liegt bei dir in /css/ -->
  <link rel="stylesheet" href="css/styles.css?v=ANA037P8"/>
  <!-- dashboard_master.css liegt bei dir (laut Repo-Screenshot) in /css/ -->
  <link rel="stylesheet" href="css/dashboard_master.css?v=ANA037P8"/>

  <style>
    /* Topbar Layout (iPad & Desktop stabil) */
    .topbar{position:sticky; top:0; z-index:50;}
    .topbar__inner{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:10px 12px 14px;}
    .tabs{flex:1; display:flex; flex-direction:column; gap:10px; align-items:center;}
    .tabs__row{display:flex; flex-wrap:wrap; justify-content:center; gap:10px;}
    .tabs__row--quick{gap:8px;}
    .tab{white-space:nowrap;}
    .topbar__right{display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:flex-end;}
    .sync-indicator{display:flex; align-items:center; gap:8px;}
    .sync-label{font-size:12px; opacity:.75;}
    @media (min-width: 900px){
      .topbar__inner{gap:16px; padding:10px 16px 16px;}
      .tabs__row{gap:12px;}
      .tabs__row--quick{gap:10px;}
    }
  </style>

  <style>
    /* V10FIX6_INVOICE_UI */
    .invoice-form .row{margin-bottom:8px}
    .invoice-form label{font-size:13px}
    .invoice-form input, .invoice-form select{padding:6px 8px;font-size:14px}
    .status-pill{display:inline-block;padding:4px 10px;border-radius:20px;font-size:13px;font-weight:600}
    .status-open{background:#f5c542;color:#000}
    .status-paid{background:#3cb371;color:#fff}
    .status-storno{background:#c0392b;color:#fff}
  </style>

  <!-- Dokument / PDF Viewer (Modal) CSS bleibt wie gehabt (kommt aus styles.css + dashboard_master.css) -->
</head>

<body class="bg-watermark page-app">

<header class="topbar">
  <div class="topbar__inner">

    <!-- Start/Pfote: Button MUSS geschlossen sein -->
    <button class="tab paw-start is-active" data-tab="home" id="pawStartBtn" aria-label="Start" type="button">
      <span class="paw-start__icon" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="40" height="40" focusable="false" aria-hidden="true">
          <circle cx="18" cy="20" r="6" fill="currentColor"/>
          <circle cx="32" cy="16" r="6" fill="currentColor"/>
          <circle cx="46" cy="20" r="6" fill="currentColor"/>
          <circle cx="14" cy="34" r="6" fill="currentColor"/>
          <circle cx="50" cy="34" r="6" fill="currentColor"/>
          <path d="M32 58c-10 0-18-6-18-14 0-7 6-13 14-14 1-.1 2 .3 2.7 1.1 1.6 1.8 4.1 3.1 7.3 3.1s5.7-1.3 7.3-3.1c.7-.8 1.7-1.2 2.7-1.1 8 1 14 7 14 14 0 8-8 14-18 14-4.6 0-6.6-1.7-8-3.2-1.4 1.5-3.4 3.2-8 3.2z" fill="currentColor"/>
        </svg>
      </span>
      <span class="paw-start__label">Start</span>
    </button>

    <nav class="tabs" role="tablist" aria-label="Navigation">
      <div class="tabs__row tabs__row--main">
        <button class="tab" data-tab="dogs" type="button"><span class="tab-ico" aria-hidden="true">🐶</span>Hunde/Kunden</button>
        <button class="tab" data-tab="contract" type="button"><span class="tab-ico" aria-hidden="true">📄</span>Betreuungsvertrag</button>
        <button class="tab" data-tab="workforms" type="button"><span class="tab-ico" aria-hidden="true">📝</span>Arbeitsblätter</button>
        <button class="tab" data-tab="hygiene" id="tabHygiene" type="button"><span class="tab-ico" aria-hidden="true">🧼</span>Hygiene</button>
        <button class="tab" data-tab="medication" id="tabMedication" type="button"><span class="tab-ico" aria-hidden="true">💊</span>Medikamente</button>
        <button class="tab" data-tab="analytics" id="tabAnalytics" type="button"><span class="tab-ico" aria-hidden="true">📊</span>Auswertungen</button>
      </div>

      <div class="tabs__row tabs__row--quick">
        <button class="tab" data-tab="calendar" id="tabCalendar" type="button"><span class="tab-ico" aria-hidden="true">📅</span>Kalender</button>
        <button class="tab" data-tab="inbox" id="tabInbox" type="button"><span class="tab-ico" aria-hidden="true">📥</span>Eingänge</button>
        <button class="tab" data-tab="documents" type="button"><span class="tab-ico" aria-hidden="true">🏠</span>Aufenthalte</button>
        <button class="tab" data-tab="invoices" id="tabInvoices" type="button"><span class="tab-ico" aria-hidden="true">🧾</span>Rechnungen</button>
        <button class="tab" data-tab="settings" id="tabSettings" type="button"><span class="tab-ico" aria-hidden="true">⚙️</span>Einstellungen</button>
      </div>
    </nav>

    <div class="topbar__right">
      <div class="sync-indicator" aria-label="Status">
        <span class="sync-label" id="syncStatusLabel" aria-hidden="true">Status:</span>
        <span class="status-dot offline" id="syncDot" aria-hidden="true"></span>
        <span class="sync-text" id="syncStatus" title="Speicher- &amp; Sync-Status">Offline</span>
      </div>
      <div class="sync-user" id="syncUser" title="Aktiver Benutzer" style="display:none"></div>
      <button class="btn btn-logout" id="btnLogoutTop" type="button" style="display:none" aria-label="Abmelden">Abmelden</button>
    </div>

  </div>
</header>

<main class="shell">

  <!-- HOME -->
  <section class="panel is-active" id="home">
    <section class="dashboard">
      <div class="dashboard-top">
        <div class="hero-card hero-card--side">
          <div class="hero-header">
            <span class="hero-icon">🐕</span>
            <span class="hero-title">Tagesbetreuung</span>
          </div>
          <div class="hero-value" id="todayDaycareValue">0 / 13</div>
          <div class="hero-bar"><div class="hero-bar-fill" id="todayDaycareBar"></div></div>
          <div class="hero-sub" id="todayDaycareText">Ruhiger Tag</div>
        </div>

        <div class="dashboard-brand">
          <img src="assets/logo.png" alt="Doggy Style" class="dashboard-brand__logo"/>
          <div class="dashboard-brand__quote handwriting">„Arbeit macht nicht frei, dabei ist Freiheit, was wir brauchen.<br>Das Leben geht so schnell vorbei, das kannst du mir ruhig glauben
