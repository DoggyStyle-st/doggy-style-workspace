<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DoggyStyle Workspace</title>
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="stylesheet" href="./css/dashboard_master.css">
</head>
<body>
  <!-- legacy UI will render into #appRoot -->
  <div id="appRoot"></div>
  <div class="build-badge" id="buildBadge">Build ANA037-STARTAPP-FINAL</div>

  <!-- Firebase config from ROOT -->
  <script defer src="./firebase-config.js?v=ANA037_APP_CFG"></script>
  <!-- Firebase compat libs -->
  <script defer src="https://www.gstatic.com/firebasejs/9.6.11/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.6.11/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.6.11/firebase-firestore-compat.js"></script>

  <!-- Auth guard (redirects to login.html if not logged in) -->
  <script defer src="./auth.js?v=ANA037_AUTH_STABLE"></script>

  <!-- Main loader (loads legacy scripts + starts app) -->
  <script defer src="./app.js?v=ANA037_APP_LOADER"></script>
</body>
</html>
