<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Doggy Style Workspace · App</title>

<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#101014"/>
<link rel="apple-touch-icon" href="assets/logo.png"/>
<link rel="stylesheet" href="styles.css?v=20260103v11"/>

<style>
.sync-indicator{display:flex;align-items:center;gap:8px}
.status-dot{
  width:10px;height:10px;border-radius:50%;
  background:#b33;
}
.status-dot.online{background:#2ecc71}
.sync-label-text{font-size:12px;opacity:.8}
</style>
</head>

<body class="bg-watermark page-app">

<header class="topbar">
  <div class="topbar__inner">

    <!-- START BUTTON -->
    <button class="tab paw-start is-active" data-tab="home" id="pawStartBtn">
      <span class="paw-start__icon">🐾</span>
      <span class="paw-start__label">Start</span>
    </button>

    <!-- NAVIGATION -->
    <nav class="tabs">
      <div class="tabs__row">
        <button class="tab" data-tab="dogs">Hunde/Kunden</button>
        <button class="tab" data-tab="contract">Betreuungsvertrag</button>
        <button class="tab" data-tab="workforms">Arbeitsblätter</button>
        <button class="tab" data-tab="documents">Aufenthalte</button>
        <button class="tab" data-tab="settings">Einstellungen</button>
      </div>
    </nav>

    <!-- STATUS -->
    <div class="topbar__right">
      <div class="sync-indicator">
        <span class="sync-label">Status:</span>
        <span class="status-dot" id="syncDot"></span>
        <span class="sync-label-text" id="syncStatus">Offline</span>
      </div>
    </div>

  </div>
</header>

<main class="shell">
  <!-- INHALT BLEIBT UNVERÄNDERT -->
</main>

<!-- BOTTOM LOGOUT -->
<div class="bottom-actions">
  <button class="btn btn--mini btn--logout" id="btnLogoutBottom">
    Ausloggen / Logout
  </button>
</div>

<script src="app.js?v=20260103v11"></script>
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js?v=20260103v11');
}
</script>

</body>
</html>
<!-- HIER ENDET DIE KORRIGIERTE DATEI -->
