(orgId) && role(orgId) == 'staff'); }\n    function own(data) { return signedIn() && data.get('customerUid', '') == request.auth.uid; }\n    function assigned(orgId) {\n      return signedIn() && orgAllowed(orgId) && exists(userPath(orgId))\n        && profile(orgId).get('accessSchemaVersion', 0) == 3\n        && profile(orgId).get('customerId', '') is string && profile(orgId).customerId != ''\n        && profile(orgId).get('petIds', []) is list;\n    }\n    function targetMap(data, cid, pid) {\n      return data is map && data.get('customerId', cid) == cid\n        && data.get('petId', pid) == pid && data.get('dogId', pid) == pid;\n    }\n    function payloadTarget(data, cid, pid) {\n      let p = data.payloadSubmitted;\n      return targetMap(p, cid, pid)\n        && targetMap(p.get('meta', {}), cid, pid) && targetMap(p.get('fields', {}), cid, pid)\n        && (!p.keys().hasAny(['customer']) || (p.customer is map && p.customer.get('id', '') == cid && p.customer.get('customerId', cid) == cid))\n        && (!p.keys().hasAny(['pet']) || (p.pet is map && p.pet.get('id', '') == pid\n          && p.pet.get('petId', pid) == pid && p.pet.get('dogId', pid) == pid && p.pet.get('customerId', '') == cid));\n    }\n    function photoTarget(photo, orgId, pid) {\n      return photo is string && (photo == '' || (photo.size() \u003c 180000 && photo.matches('data:image/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+'))\n        || (pid != '' && photo.split('/').size() == 5 && photo.split('/')[0] == 'ds-storage:orgs'\n          && photo.split('/')[1] == orgId && photo.split('/')[2] == 'pets' && photo.split('/')[3] == pid && photo.split('/')[4] != ''));\n    }\n    function petPhotos(data, orgId) {\n      let pet = data.payloadSubmitted.get('pet', {});\n      return photoTarget(pet.get('profilePhoto', ''), orgId, data.petId) && photoTarget(pet.get('vaccinationPassPhoto', ''), orgId, data.petId);\n    }\n    function contractPayload(data, orgId) {\n      let p = data.payloadSubmitted;\n      r && d.dogId is string && d.dogId != '' && d.petId == d.dogId\n        && d.customerId is string && d.dogName is string && d.breed is string && d.sex is string\n        && d.date is string && d.date.matches('[0-9]{4}-[0-9]{2}-[0-9]{2}')\n        && d.type in ['arrival','mid','departure'] && d.schema == 'M50.10_STAT_CORE_V1'\n        && d.notes is string && d.notes.size() \u003c= 10000 && d.qualitative is map && d.context is map\n        && (d.ageYears == null || (d.ageYears is number && d.ageYears >= 0 && d.ageYears \u003c= 40))\n        && d.scores is map && d.scores.keys().hasOnly(keys) && d.scales == d.scores\n        && validStatScore(d.scores, 'social') && validStatScore(d.scores, 'food') && validStatScore(d.scores, 'handling')\n        && validStatScore(d.scores, 'leash') && validStatScore(d.scores, 'stress') && validStatScore(d.scores, 'noise')\n        && validStatScore(d.scores, 'separation') && validStatScore(d.scores, 'play') && validStatScore(d.scores, 'health') && validStatScore(d.scores, 'hygiene')\n        && d.dogsInGroup is list && d.dogsInGroup.size() >= 1 && d.dogsInGroup.size() \u003c= 4 && d.dogId in d.dogsInGroup\n        && d.context.groupSize == d.dogsInGroup.size()\n        && d.indexB is number && d.indexB >= 1 && d.indexB \u003c= 10 && d.updatedAtLocal is number\n        && d.createdBy == request.auth.uid && d.updatedBy == request.auth.uid\n        && d.createdAt == request.time && d.updatedAt == request.time;\n    }\n    match /orgs/{orgId}/statistics/{id} {\n      allow read: if staff(orgId);\n      allow create: if staff(orgId) && validStatistic(id);\n      // A new observation gets its own ID. Existing assessments stay intact.\n      allow update, delete: if false;\n    }\n    match /orgs/{orgId}/stats/{id} {\n      allow read: if staff(orgId);\n      allow write: if false;\n    }\n    // Corrections keep legacy source documents intact. Tombstones prevent cache reappearance.\n    function optionalStatScore(scores, key) { return !scores.k
